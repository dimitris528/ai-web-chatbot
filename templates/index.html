<!DOCTYPE html>
<html>
<head>
    <title>AI Chatbot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .chat-container {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 10px;
        }
        .message {
            margin: 5px 0;
            padding: 5px 10px;
            border-radius: 5px;
        }
        .user-message { background-color: #e0f7fa; }
        .bot-message { background-color: #f0f0f0; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">AI Chatbot</h1>
        <div class="chat-container" id="chatLog"></div>
        <div class="input-group mb-3">
            <input type="text" id="userInput" class="form-control" placeholder="Type your message...">
            <button onclick="sendMessage()" class="btn btn-primary">Send</button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function sendMessage() {
            const message = document.getElementById('userInput').value;
            if (!message) return;

            // Εμφάνιση ερώτησης στο chat log
            addMessage(message, 'user-message');

            fetch('/ask', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: message})
            })
            .then(response => response.json())
            .then(data => {
                addMessage(data.response || "No response", 'bot-message');
            })
            .catch(error => {
                addMessage("Error: " + error, 'bot-message');
            });

            // Καθαρισμός input
            document.getElementById('userInput').value = '';
        }

        // Προσθήκη μηνύματος στο chat log
        function addMessage(text, className) {
            const chatLog = document.getElementById('chatLog');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${className}`;
            messageDiv.textContent = text;
            chatLog.appendChild(messageDiv);
            chatLog.scrollTop = chatLog.scrollHeight; // Auto scroll
        }

        // Enter key support
        document.getElementById('userInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
